name: offsec-m01

services:
  attacker:
    container_name: offsec-m01-attacker
    build:
      context: ./attacker
    init: true
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    networks:
      - lab

  target:
    container_name: target-m01
    build:
      context: ./target
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    expose:
      - "22"
      - "80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      lab:
        aliases:
          - target-m01

networks:
  lab:
    name: offsec-m01-net
    driver: bridge
    internal: true
    attachable: false
