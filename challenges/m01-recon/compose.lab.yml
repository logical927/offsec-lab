name: offsec-m01

services:
  attacker:
    container_name: offsec-m01-attacker
    build:
      context: ./attacker
    init: true
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    networks:
      - lab

networks:
  lab:
    name: offsec-m01-net
    driver: bridge
    internal: true
    attachable: false
